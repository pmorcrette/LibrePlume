[workspace]
resolver = "2"
members = ["crates/libreplume-core", "crates/libreplume-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/pmorcrette/LibrePlume"
rust-version = "1.85"

[workspace.dependencies]
libreplume-core = { path = "crates/libreplume-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
