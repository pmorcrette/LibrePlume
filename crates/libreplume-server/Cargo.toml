[package]
name = "libreplume-server"
description = "LibrePlume HTTP server, web interface and MCP endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "libreplume"
path = "src/main.rs"

[dependencies]
libreplume-core.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "fs", "sync"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace", "limit", "set-header"] }
rust-embed = { version = "8", features = ["mime-guess"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
