name: Release

# Push a version tag on a commit of master to publish the binaries:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must point to a commit of master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME is not on master; releases are only built from master."
            exit 1
          fi
      - name: Tag must match the crate and extension versions
        id: version
        run: |
          # Assigned first: a failure inside "echo $(…)" would not fail the step.
          version=$(scripts/check-release-version.sh "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are fully static (musl): they run on any distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p libreplume-server --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/libreplume
          "$bin" --version
          # « check » exits with 1 when it finds issues, which it must here.
          if echo "Il à mangé." | "$bin" check --data-dir "$RUNNER_TEMP/data" -; then
            echo "::error::the binary did not report the mistake"
            exit 1
          fi
      - name: Package
        shell: bash
        run: |
          name=libreplume-${{ needs.verify.outputs.version }}-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/libreplume.exe "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
            archive="dist/$name.zip"
          else
            cp target/${{ matrix.target }}/release/libreplume "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            archive="dist/$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          else
            (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  extension:
    name: Package Firefox extension
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes web-ext@8 build --source-dir extension/firefox --artifacts-dir dist --filename "libreplume-firefox-${{ needs.verify.outputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip

  publish:
    name: Publish GitHub release
    needs: [verify, build, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cd dist && cat *.sha256 > SHA256SUMS && rm *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          name: LibrePlume ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
